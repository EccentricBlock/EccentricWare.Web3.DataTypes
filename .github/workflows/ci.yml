name: CI

# Build and test on every push and pull request to main, on the operating systems and CPU architectures the library
# targets: x64 (ubuntu-latest, windows-latest) and arm64 (ubuntu-24.04-arm, macos-latest). publish.yml (release only) is unchanged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: EccentricWare.Web3.DataTypes.slnx
  TEST_PROJECT_PATH: Eccentricware.Web3.DataTypes.Test
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Builds the library, the tests and the benchmark project (compiled only; benchmarks are never run in CI).
      # Warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build

  # UInt256BulkSimd dispatches on Avx2.IsSupported with no in-process seam, so its public scalar fallback only runs when
  # AVX2 is off (the same second pass publish.yml makes before packing). Linux x64 only: the variable has no effect on arm64.
  scalar-fallbacks:
    name: scalar-fallbacks (AVX2 disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test with AVX2 disabled
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build
        env:
          DOTNET_EnableAVX2: "0"
